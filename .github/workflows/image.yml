# The multi-arch image of a release, from the binaries rust.yml built in the same run: each arch on its
# own runner, merged into one manifest by digest, at ghcr.io/<owner>/<repo>:<tag>. The caller's
# Dockerfile copies `target/${TARGETARCH}/release/<name>`. With push off, a pull request builds the same
# Dockerfile from placeholders and keeps nothing, so a Dockerfile the release would fail on fails there.
name: Image

on:
  workflow_call:
    inputs:
      tag:
        description: Tag the manifest is pushed under, such as tag-release.yml's `tag` output. Required with push on.
        type: string
        default: ""
      push:
        description: Build from the run's binaries and push. Off, a pull request's check builds from placeholders and pushes nothing.
        type: boolean
        default: true
      binaries:
        description: Space-separated binary names the Dockerfile copies; the placeholders a check builds from when push is off.
        type: string
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: inputs.push
        with:
          name: binaries-${{ matrix.arch }}
          path: target/

      # An artifact keeps no file modes.
      - name: Make the binaries executable
        id: executable
        if: inputs.push
        run: chmod 0755 "target/$ARCH/release/"*

      # The Dockerfile and its .dockerignore are what a check is after, not the binaries: empty files at
      # the paths the release stages them at fail the same COPY a release would.
      - name: Placeholders for the binaries
        id: placeholders
        if: ${{ !inputs.push }}
        env:
          BINARIES: ${{ inputs.binaries }}
        run: |
          read -ra names <<<"$BINARIES"
          [ ${#names[@]} -gt 0 ] || { echo "::error::a check without push needs the binaries input"; exit 1; }
          mkdir -p "target/$ARCH/release"
          for name in "${names[@]}"; do
            : > "target/$ARCH/release/$name"
          done

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An OCI reference is lowercase; an organisation's name need not be.
      - name: Build the image and push it by digest
        id: build
        env:
          PUSH: ${{ inputs.push }}
          TAG: ${{ inputs.tag }}
        run: |
          output=type=cacheonly
          if [ "$PUSH" = true ]; then
            [ -n "$TAG" ] || { echo "::error::push needs the tag input"; exit 1; }
            output="type=image,name=$REGISTRY/${GITHUB_REPOSITORY,,},push-by-digest=true,name-canonical=true,push=true"
          fi
          docker buildx build --platform "linux/$ARCH" --output "$output" \
            --metadata-file "$RUNNER_TEMP/metadata.json" .

      - name: Export the digest
        id: digest
        if: inputs.push
        run: |
          digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: inputs.push
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: inputs.push
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ inputs.tag }}
        run: |
          image=$REGISTRY/${GITHUB_REPOSITORY,,}
          digests=(*)
          docker buildx imagetools create -t "$image:$TAG" "${digests[@]/#/$image@sha256:}"
