# The caller's Helm chart at a release's version, pushed to oci://ghcr.io/<owner>/<repo> and kept as the
# run's `chart` artifact for release.yml. `helm push` names the artifact after the chart, so under the
# repository path it lands beside the image instead of on it. The caller runs it after image.yml, so a
# published chart never names an image that does not exist yet.
name: Chart

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, such as tag-release.yml's `tag` output; the chart's version without the `v`, and its appVersion as it is.
        type: string
        required: true
      path:
        description: The chart's directory in the checkout.
        type: string
        default: helm

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  chart:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@v5

      # The tag is the one version source for the chart and the image tag it deploys by default.
      - name: Package the chart
        id: package
        env:
          TAG: ${{ inputs.tag }}
          CHART: ${{ inputs.path }}
        run: |
          [ -n "$TAG" ] || { echo "::error::the tag input is empty: run chart.yml only for a release"; exit 1; }
          helm package "$CHART" --version "${TAG#v}" --app-version "$TAG" -d "$RUNNER_TEMP/chart"

      # An OCI reference is lowercase; an organisation's name need not be.
      - name: Push the chart
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          helm push "$RUNNER_TEMP"/chart/*.tgz "oci://$REGISTRY/${GITHUB_REPOSITORY,,}"

      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: ${{ runner.temp }}/chart/*.tgz
          if-no-files-found: error
          retention-days: 1
